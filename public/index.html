<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>第一分公司数据中台</title>
  <link rel="stylesheet" href="/css/style.css?v=20261106a" />
</head>
<body>

  <!-- ===== 登录页 ===== -->
  <div class="login-wrap" id="loginWrap">
    <div class="login-left">
      <div class="brand">HuiMai Data Middle Platform</div>
      <div class="title">第一分公司<br/>数据中台</div>
      <div class="sub">数据驱动经营 · 实时洞察 · 全员共享</div>
    </div>
    <div class="login-card">
      <h2>欢迎登录</h2>
      <div class="login-err" id="loginErr"></div>
      <form id="loginForm">
        <div class="field">
          <label>账号</label>
          <div class="input-box">
            <svg viewBox="0 0 24 24"><path d="M12 12a5 5 0 1 0-5-5 5 5 0 0 0 5 5Zm0 2c-4 0-8 2-8 5v1h16v-1c0-3-4-5-8-5Z"/></svg>
            <input id="username" type="text" placeholder="请输入账号" autocomplete="username" />
          </div>
        </div>
        <div class="field">
          <label>密码</label>
          <div class="input-box">
            <svg viewBox="0 0 24 24"><path d="M17 9V7a5 5 0 0 0-10 0v2H5v13h14V9h-2ZM9 7a3 3 0 0 1 6 0v2H9V7Zm4 9.7V18a1 1 0 0 1-2 0v-1.3a1.5 1.5 0 1 1 2 0Z"/></svg>
            <input id="password" type="password" placeholder="请输入密码" autocomplete="current-password" />
          </div>
        </div>
        <label class="remember"><input type="checkbox" id="remember" /> 记住密码</label>
        <div class="forgot" onclick="alert('请联系系统管理员重置密码')">忘记密码?</div>
        <button class="btn-login" type="submit">登 录</button>
      </form>
      <div class="login-foot">Copyright © 2022-2026 第一分公司数据云台 All Rights Reserved.</div>
    </div>
  </div>

  <!-- ===== 应用框架 ===== -->
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar">
      <div class="logo">
        <div class="t">第一分公司数据中台</div>
        <div class="s">FIRST BRANCH · DATA</div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="collapse" id="collapseBtn">⟨ 收起</div>
    </aside>
    <div class="main">
      <header class="topbar">
        <button class="menu-btn" id="menuBtn" aria-label="菜单">☰</button>
        <div class="crumb" id="crumb">首页</div>

        <div class="topbar-tools">
          <!-- 上次拉取时间 -->
          <button class="sync-chip" id="syncChip" title="查看数据同步详情">
            <i class="dot"></i>
            <span class="sc-t" id="syncLabel">上次检查</span>
            <b id="syncTime">--</b>
            <span class="sc-age" id="syncAge"></span>
          </button>

          <!-- 月份筛选 -->
          <label class="month-pick" id="monthPick" title="按月份查看指标">
            <svg viewBox="0 0 24 24"><path d="M7 2v3M17 2v3M3 9h18M5 5h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2Z"/></svg>
            <select id="monthSelect" class="month-select"></select>
          </label>

          <!-- 命令面板入口 -->
          <div class="search-trigger" id="searchTrigger">
            <svg viewBox="0 0 24 24"><path d="M10 18a8 8 0 1 1 0-16 8 8 0 0 1 0 16Zm9.7 2.3-4.2-4.2"/></svg>
            <span class="placeholder-text">搜索主播、商品、类目…</span>
            <span class="kbd">Ctrl K</span>
          </div>
        </div>

        <div class="clock" id="topClock">--</div>
        <div class="user">
          <div class="avatar" id="avatar">张</div>
          <span id="userName">--</span>
          <a href="/admin.html" class="admin-link">后台</a>
          <span class="logout" id="logoutBtn">退出</span>
        </div>
      </header>
      <div class="syncbar" id="syncBar" style="display:none"></div>
      <div class="content" id="content">
        <div class="kpi-row"><div class="skeleton sk-card"></div><div class="skeleton sk-card"></div><div class="skeleton sk-card"></div><div class="skeleton sk-card"></div></div>
        <div class="skeleton" style="height:300px"></div>
      </div>
    </div>
  </div>

  <!-- ===== 右侧抽屉 ===== -->
  <div class="drawer-mask" id="drawerMask"></div>
  <div class="drawer" id="drawer">
    <div class="drawer-head">
      <div>
        <div class="dh-title" id="drawerTitle">—</div>
        <div class="dh-sub" id="drawerSub"></div>
      </div>
      <button class="drawer-close" id="drawerClose">×</button>
    </div>
    <div class="drawer-body" id="drawerBody"></div>
  </div>

  <!-- ===== 同步详情 ===== -->
  <div class="modal-mask" id="syncMask">
    <div class="modal-panel">
      <div class="modal-head">
        <div>
          <div class="mh-title">数据同步状态</div>
          <div class="mh-sub" id="syncSub">—</div>
        </div>
        <button class="drawer-close" id="syncClose">×</button>
      </div>
      <div class="modal-body" id="syncBody"></div>
    </div>
  </div>

  <!-- ===== 图表大图 ===== -->
  <div class="chart-modal-mask" id="chartMask">
    <div class="chart-modal">
      <div class="cm-head">
        <div class="cm-title">
          <b id="cmTitle">图表</b>
          <span class="cm-sub" id="cmSub"></span>
        </div>
        <div class="cm-actions">
          <button class="tbtn sm" id="cmToggle" type="button">数据表</button>
          <button class="drawer-close" id="cmClose" type="button">×</button>
        </div>
      </div>
      <div class="cm-legend" id="cmLegend"></div>
      <div class="cm-body" id="cmBody"></div>
      <div class="cm-foot"><span>移动鼠标看具体数值 · 按 Esc 关闭</span></div>
    </div>
  </div>

  <!-- ===== 命令面板 ===== -->
  <div class="cmd-mask" id="cmdMask">
    <div class="cmd-panel">
      <div class="cmd-input-wrap">
        <svg viewBox="0 0 24 24"><path d="M10 18a8 8 0 1 1 0-16 8 8 0 0 1 0 16Zm9.7 2.3-4.2-4.2"/></svg>
        <input class="cmd-input" id="cmdInput" placeholder="搜索主播、商品、类目，或跳转页面…" />
        <span class="cmd-esc">ESC</span>
      </div>
      <div class="cmd-list" id="cmdList"></div>
    </div>
  </div>

  <!-- 图表悬停浮层 / 轻提示 -->
  <div class="chart-tip" id="chartTip"></div>
  <div class="toast" id="toast"></div>

  <script src="/js/charts.js?v=20261106a"></script>
  <script src="/js/insights.js?v=20261106a"></script>
  <script src="/js/app.js?v=20261106a"></script>
</body>
</html>
